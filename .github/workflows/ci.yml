name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            working-directory: server
          - app: client
            working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint

  unit-integration:
    name: Unit and Integration Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run server tests
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_for_tests_only
          REFRESH_TOKEN_SECRET: ci_refresh_secret_for_tests_only
          TOTP_ENCRYPTION_KEY: ci_totp_secret_for_tests_only
          MONGODB_URI: mongodb://127.0.0.1:27017/devcollab_test
          REDIS_URL: redis://127.0.0.1:6379
          CSRF_DISABLED: "true"
        run: npm test

      - name: Run client unit tests
        working-directory: client
        run: npm run test:ci

  e2e:
    name: E2E Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 3443
          JWT_SECRET: ci_jwt_secret_for_tests_only
          REFRESH_TOKEN_SECRET: ci_refresh_secret_for_tests_only
          TOTP_ENCRYPTION_KEY: ci_totp_secret_for_tests_only
          MONGODB_URI: mongodb://127.0.0.1:27017/devcollab_e2e
          REDIS_URL: redis://127.0.0.1:6379
          CLIENT_URL: http://127.0.0.1:5173
          ENABLE_HTTPS: "false"
        run: |
          npm start > ../server-e2e.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3443/health && exit 0
            sleep 2
          done
          cat ../server-e2e.log
          exit 1

      - name: Start client
        working-directory: client
        env:
          VITE_API_URL: http://127.0.0.1:3443/api
          VITE_SOCKET_URL: http://127.0.0.1:3443
        run: |
          npm run dev -- --host 127.0.0.1 > ../client-e2e.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/login && exit 0
            sleep 2
          done
          cat ../client-e2e.log
          exit 1

      - name: Run Playwright E2E
        working-directory: client
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          if-no-files-found: ignore
